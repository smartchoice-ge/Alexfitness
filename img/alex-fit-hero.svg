<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
<defs>

  <!-- Glow filters -->
  <filter id="glow-g" x="-45%" y="-45%" width="190%" height="190%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-b" x="-45%" y="-45%" width="190%" height="190%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="ambient-g" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="85"/>
  </filter>
  <filter id="ambient-b" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="70"/>
  </filter>
  <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Diamond grid (boxing ring chain-link feel) -->
  <pattern id="diamonds" x="0" y="0" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M22,2 L42,22 L22,42 L2,22 Z"
          fill="none" stroke="#4ade80" stroke-width="0.65" opacity="0.38"/>
  </pattern>

  <!-- Dot grid (gym/tech feel) -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="1.1" fill="#38bdf8" opacity="0.45"/>
  </pattern>

  <!-- Center vignette: darkens edges so hero text stays readable -->
  <radialGradient id="vig" cx="50%" cy="50%" r="52%">
    <stop offset="0%"   stop-color="#070d09" stop-opacity="0.15"/>
    <stop offset="52%"  stop-color="#070d09" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#070d09" stop-opacity="0.70"/>
  </radialGradient>

  <!-- Horizontal fade at the very bottom (merges into packages section) -->
  <linearGradient id="bottom-fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="75%"  stop-color="#070d09" stop-opacity="0"/>
    <stop offset="100%" stop-color="#070d09" stop-opacity="1"/>
  </linearGradient>

</defs>

<!-- ═══ BASE ═══ -->
<rect width="1440" height="900" fill="#070d09"/>

<!-- ═══ AMBIENT GLOWS ═══ -->
<!-- Green orb – left half (boxing glove side) -->
<circle cx="310" cy="445" r="400" fill="#4ade80" opacity="0.17" filter="url(#ambient-g)"/>
<!-- Blue orb – right half (dumbbell side) -->
<circle cx="1115" cy="425" r="340" fill="#38bdf8" opacity="0.13" filter="url(#ambient-b)"/>
<!-- Small accent orb – upper center -->
<circle cx="720" cy="200" r="180" fill="#4ade80" opacity="0.05" filter="url(#ambient-g)"/>

<!-- ═══ GRID PATTERNS ═══ -->
<!-- Diamond grid fills the left boxing zone -->
<rect x="0"   y="0" width="690" height="900" fill="url(#diamonds)"/>
<!-- Dot grid fills the right gym zone -->
<rect x="760" y="0" width="680" height="900" fill="url(#dots)"/>

<!-- ═══ DIAGONAL DIVIDER ═══ -->
<line x1="700" y1="0"   x2="575" y2="900" stroke="#4ade80" stroke-width="1.2" opacity="0.20"/>
<line x1="718" y1="0"   x2="593" y2="900" stroke="#38bdf8" stroke-width="0.6" opacity="0.10"/>
<!-- Small accent chevrons along the divider -->
<g stroke="#4ade80" stroke-width="1" opacity="0.18" fill="none">
  <path d="M 698,90  L 708,110 L 698,130"/>
  <path d="M 693,240 L 703,260 L 693,280"/>
  <path d="M 688,390 L 698,410 L 688,430"/>
  <path d="M 683,540 L 693,560 L 683,580"/>
  <path d="M 678,690 L 688,710 L 678,730"/>
</g>

<!-- ═══ BOXING RING ROPES (far-left atmospheric) ═══ -->
<g stroke="#4ade80" fill="none" opacity="0.16">
  <!-- Corner post -->
  <line x1="58" y1="90" x2="58" y2="830" stroke-width="3"/>
  <rect x="44" y="84" width="28" height="18" rx="4" stroke-width="1.5"/>
  <!-- Three ropes -->
  <path d="M58,215 Q290,200 590,218" stroke-width="1.8"/>
  <path d="M58,380 Q290,365 590,382" stroke-width="1.8"/>
  <path d="M58,545 Q290,530 590,548" stroke-width="1.8"/>
  <!-- Turnbuckles -->
  <circle cx="58" cy="215" r="8" stroke-width="1.5"/>
  <circle cx="58" cy="380" r="8" stroke-width="1.5"/>
  <circle cx="58" cy="545" r="8" stroke-width="1.5"/>
  <!-- Rope texture dashes -->
  <g stroke-width="1" opacity="0.5" stroke-dasharray="4,6">
    <path d="M58,215 Q290,200 590,218"/>
    <path d="M58,380 Q290,365 590,382"/>
    <path d="M58,545 Q290,530 590,548"/>
  </g>
</g>

<!-- ═══ LEANING BARBELL (far-right atmospheric) ═══ -->
<g transform="translate(1398,140)" stroke="#38bdf8" fill="none" opacity="0.19">
  <!-- Bar -->
  <line x1="0" y1="0" x2="-95" y2="660" stroke-width="3.5"/>
  <!-- Top plates -->
  <ellipse cx="-4"   cy="16"  rx="34" ry="11" stroke-width="2"/>
  <ellipse cx="-8"   cy="30"  rx="34" ry="11" stroke-width="2"/>
  <ellipse cx="-12"  cy="44"  rx="32" ry="9"  stroke-width="1.5" opacity="0.6"/>
  <!-- Bottom plates -->
  <ellipse cx="-83"  cy="634" rx="34" ry="11" stroke-width="2"/>
  <ellipse cx="-87"  cy="620" rx="34" ry="11" stroke-width="2"/>
  <ellipse cx="-91"  cy="606" rx="32" ry="9"  stroke-width="1.5" opacity="0.6"/>
</g>

<!-- ═══════════════════════════════════════════════════════ -->
<!--  BOXING GLOVE  –  left composition                     -->
<!--  Center: translate(310, 440)                           -->
<!--  Glove throws a right jab toward the center           -->
<!-- ═══════════════════════════════════════════════════════ -->
<g transform="translate(310,440)" filter="url(#glow-g)">

  <!-- Impact motion lines (horizontal speed lines to the right) -->
  <g stroke="#4ade80" stroke-linecap="round" opacity="0.28">
    <line x1="174" y1="-130" x2="318" y2="-145" stroke-width="1.9"/>
    <line x1="178" y1="-88"  x2="325" y2="-86"  stroke-width="1.7"/>
    <line x1="175" y1="-44"  x2="318" y2="-34"  stroke-width="1.6"/>
    <line x1="170" y1="4"    x2="310" y2="16"   stroke-width="1.5"/>
    <line x1="164" y1="50"   x2="300" y2="64"   stroke-width="1.3"/>
  </g>
  <!-- Impact sparks -->
  <g stroke="#4ade80" stroke-linecap="round" opacity="0.60">
    <line x1="193" y1="-138" x2="220" y2="-165" stroke-width="2.5"/>
    <line x1="208" y1="-108" x2="238" y2="-93"  stroke-width="2.0"/>
    <line x1="186" y1="-90"  x2="204" y2="-66"  stroke-width="2.0"/>
    <line x1="178" y1="-152" x2="190" y2="-172" stroke-width="1.8"/>
  </g>

  <!-- ── Main glove body ── -->
  <path d="
    M -55,82
    C -86,80 -106,59 -109,31
    L -111,-62
    C -111,-132 -76,-177 -11,-187
    C 50,-197 121,-173 156,-121
    C 189,-71 183,11 161,51
    C 139,89 96,101 56,101
    L -31,101
    C -46,101 -55,93 -55,82 Z"
    fill="#0a1c11" stroke="#4ade80" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Glove inner fill highlight -->
  <path d="
    M -40,70
    C -65,68 -82,50 -84,25
    L -86,-50
    C -86,-108 -58,-146 -3,-155
    C 42,-163 98,-143 124,-100
    C 150,-58 145,14 126,46
    C 107,78 74,88 45,88
    L -20,88 Z"
    fill="#0d2217" opacity="0.60"/>

  <!-- Knuckle ridge -->
  <path d="M -43,-130 C 21,-164 97,-160 154,-110"
        fill="none" stroke="#4ade80" stroke-width="2.2" opacity="0.55"/>

  <!-- Individual knuckle bumps -->
  <path d="M -43,-118 C -27,-129 -7,-129  9,-116"  fill="none" stroke="#4ade80" stroke-width="1.6" opacity="0.45"/>
  <path d="M  23,-140 C  43,-150 62,-149 76,-135"  fill="none" stroke="#4ade80" stroke-width="1.6" opacity="0.45"/>
  <path d="M  90,-150 C 110,-158 127,-154 142,-137" fill="none" stroke="#4ade80" stroke-width="1.6" opacity="0.45"/>

  <!-- ── Thumb ── -->
  <path d="
    M -109,12
    C -147,6 -168,-28 -150,-59
    C -133,-88 -99,-81 -89,-53
    C -79,-31 -91,-10 -109,12 Z"
    fill="#0a1c11" stroke="#4ade80" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Thumb inner -->
  <path d="
    M -109,12 C -136,7 -153,-22 -137,-50
    C -121,-77 -96,-71 -87,-47 Z"
    fill="#0d2217" opacity="0.55"/>

  <!-- ── Wrist cuff ── -->
  <rect x="-56" y="97" width="118" height="60" rx="14"
        fill="#071410" stroke="#4ade80" stroke-width="2.6"/>
  <!-- Velcro strap -->
  <rect x="-50" y="112" width="106" height="14" rx="4"
        fill="#0e2418" stroke="#4ade80" stroke-width="1.2" opacity="0.55"/>
  <!-- Lacing eyelets -->
  <circle cx="-22" cy="109" r="4" fill="#4ade80" opacity="0.55"/>
  <circle cx="5"   cy="109" r="4" fill="#4ade80" opacity="0.55"/>
  <circle cx="32"  cy="109" r="4" fill="#4ade80" opacity="0.55"/>
  <!-- Stitching line at base of cuff -->
  <line x1="-50" y1="148" x2="62" y2="148" stroke="#4ade80" stroke-width="1" stroke-dasharray="4,4" opacity="0.38"/>
  <!-- Brand text on cuff -->
  <text x="6" y="139"
        font-family="Arial Black, Arial, sans-serif" font-size="10.5" font-weight="900"
        fill="#4ade80" text-anchor="middle" opacity="0.82" letter-spacing="3.5">ALEX FIT</text>
</g>

<!-- ═══════════════════════════════════════════════════════ -->
<!--  DUMBBELL  –  right composition                        -->
<!--  Center: translate(1090, 430)                          -->
<!-- ═══════════════════════════════════════════════════════ -->
<g transform="translate(1090,430)" filter="url(#glow-b)">

  <!-- Left outer weight plate -->
  <rect x="-192" y="-76" width="40" height="152" rx="9"
        fill="#07101c" stroke="#38bdf8" stroke-width="2.6"/>
  <!-- Left inner collar ring -->
  <rect x="-152" y="-56" width="22" height="112" rx="6"
        fill="#07101c" stroke="#38bdf8" stroke-width="2.1" opacity="0.72"/>

  <!-- Bar -->
  <rect x="-130" y="-17" width="260" height="34" rx="9"
        fill="#07101c" stroke="#38bdf8" stroke-width="2.3"/>
  <!-- Knurling marks (grip section) -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.38" stroke-linecap="round">
    <line x1="-90" y1="-15" x2="-90" y2="15"/>
    <line x1="-63" y1="-15" x2="-63" y2="15"/>
    <line x1="-36" y1="-15" x2="-36" y2="15"/>
    <line x1="-9"  y1="-15" x2="-9"  y2="15"/>
    <line x1="18"  y1="-15" x2="18"  y2="15"/>
    <line x1="45"  y1="-15" x2="45"  y2="15"/>
    <line x1="72"  y1="-15" x2="72"  y2="15"/>
  </g>
  <!-- Bar inner fill -->
  <rect x="-128" y="-8" width="256" height="16" rx="4"
        fill="#0a1828" opacity="0.55"/>

  <!-- Right inner collar ring -->
  <rect x="130" y="-56" width="22" height="112" rx="6"
        fill="#07101c" stroke="#38bdf8" stroke-width="2.1" opacity="0.72"/>
  <!-- Right outer weight plate -->
  <rect x="152" y="-76" width="40" height="152" rx="9"
        fill="#07101c" stroke="#38bdf8" stroke-width="2.6"/>

  <!-- Weight labels -->
  <text x="-172" y="5"
        font-family="Arial Black, Arial, sans-serif" font-size="16" font-weight="900"
        fill="#38bdf8" text-anchor="middle" opacity="0.72">20</text>
  <text x="-172" y="24"
        font-family="Arial, sans-serif" font-size="9"
        fill="#38bdf8" text-anchor="middle" opacity="0.52" letter-spacing="1">KG</text>
  <text x="172"  y="5"
        font-family="Arial Black, Arial, sans-serif" font-size="16" font-weight="900"
        fill="#38bdf8" text-anchor="middle" opacity="0.72">20</text>
  <text x="172"  y="24"
        font-family="Arial, sans-serif" font-size="9"
        fill="#38bdf8" text-anchor="middle" opacity="0.52" letter-spacing="1">KG</text>

  <!-- Plate engraved ring detail -->
  <ellipse cx="-172" cy="-30" rx="12" ry="28" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.35"/>
  <ellipse cx="172"  cy="-30" rx="12" ry="28" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.35"/>

  <!-- Lifting drop-lines (weight force effect) -->
  <g stroke="#38bdf8" stroke-linecap="round" opacity="0.22">
    <line x1="-192" y1="105" x2="-210" y2="180" stroke-width="1.6"/>
    <line x1="-165" y1="110" x2="-178" y2="185" stroke-width="1.4"/>
    <line x1="-135" y1="112" x2="-142" y2="187" stroke-width="1.2"/>
    <line x1="135"  y1="112" x2="142"  y2="187" stroke-width="1.2"/>
    <line x1="165"  y1="110" x2="178"  y2="185" stroke-width="1.4"/>
    <line x1="192"  y1="105" x2="210"  y2="180" stroke-width="1.6"/>
  </g>
</g>

<!-- ═══ ACCENT SPARKLES ═══ -->
<g fill="#4ade80">
  <circle cx="190"  cy="185" r="2.8" opacity="0.68"/>
  <circle cx="535"  cy="108" r="2.0" opacity="0.55"/>
  <circle cx="95"   cy="660" r="2.2" opacity="0.50"/>
  <circle cx="452"  cy="770" r="1.6" opacity="0.42"/>
  <circle cx="620"  cy="310" r="1.4" opacity="0.38"/>
</g>
<g fill="#38bdf8">
  <circle cx="930"  cy="142" r="2.8" opacity="0.62"/>
  <circle cx="1222" cy="188" r="2.2" opacity="0.55"/>
  <circle cx="1388" cy="630" r="2.4" opacity="0.48"/>
  <circle cx="868"  cy="726" r="1.8" opacity="0.42"/>
  <circle cx="1058" cy="125" r="1.4" opacity="0.38"/>
</g>

<!-- ═══ LARGE WATERMARK TEXT (barely visible depth) ═══ -->
<text x="720" y="530"
      font-family="Arial Black, Impact, sans-serif"
      font-size="230" font-weight="900"
      fill="none" stroke="#4ade80" stroke-width="1.2"
      opacity="0.028" text-anchor="middle" letter-spacing="18">ALEX FIT</text>

<!-- ═══ VIGNETTE OVERLAY ═══ -->
<rect width="1440" height="900" fill="url(#vig)"/>

<!-- ═══ BOTTOM FADE (seamless transition to packages section) ═══ -->
<rect width="1440" height="900" fill="url(#bottom-fade)"/>

</svg>
